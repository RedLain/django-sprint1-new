{% extends "base.html" %}
{% block title %}Лента записей{% endblock %}
{% block content %}
  <div class="container py-5">
    <h1 class="mb-5 text-center"><i>Лента записей</i></h1>
    {% for post in posts reversed %}
      <article class="mb-5">
        <h2>{{ post.location }}</h2>
        <small class="text-muted">
          {{ post.date }} |
          <a href="{% url 'blog:category_posts' post.category %}">{{ post.category }}</a>
        </small>
        <p>{{ post.text|truncatewords:10 }}</p>
        <a href="{% url 'blog:post_detail' post.id %}">Читать полный текст</a>
      </article>
    {% endfor %}
  </div>
{% endblock %}
